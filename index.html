<title>Frozen Cast Finder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#150f1a;
  --curtain:#1f1620;
  --curtain-raised:#2a1e2a;
  --paper:#f4e6c4;
  --paper-shade:#e9d7a8;
  --ink:#2c1d14;
  --ink-soft:#5c493a;
  --text:#f2e9d8;
  --text-muted:#a4917e;
  --border-dark:#3b2c37;
  --border-paper:rgba(44,29,20,.22);
  --accent:#ffb703;
  --accent-ink:#1d1300;
  --accent2:#e0483e;
  --accent2-ink:#2a0805;
  --focus:#ffb703;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 420px at 50% -10%, rgba(255,183,3,.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:640px;
  margin:0 auto;
  padding:2.5rem 1.25rem 4rem;
}

/* header — a lit marquee sign */
.marquee{
  position:relative;
  text-align:center;
  background:var(--curtain);
  border:1px solid var(--border-dark);
  border-radius:.9rem;
  padding:2rem 1.5rem 1.7rem;
  margin-bottom:2.1rem;
  overflow:hidden;
}
.marquee::before,
.marquee::after{
  content:"";
  position:absolute;
  left:0; right:0;
  height:9px;
  background-image:radial-gradient(circle, var(--accent) 1.6px, transparent 1.8px);
  background-size:20px 9px;
  background-position:10px center;
  opacity:.8;
}
.marquee::before{top:0;}
.marquee::after{bottom:0;}
.eyebrow{
  font-family:'Space Mono',ui-monospace,monospace;
  font-size:.7rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 .7rem;
}
h1{
  font-family:'Bebas Neue',Impact,ui-sans-serif,sans-serif;
  font-weight:400;
  text-transform:uppercase;
  font-size:clamp(2.15rem,7.2vw,3.15rem);
  line-height:1.02;
  letter-spacing:.02em;
  margin:0 0 .6rem;
  color:var(--text);
  text-shadow:0 0 22px rgba(255,183,3,.3);
  text-wrap:balance;
}
.sub{
  color:var(--text-muted);
  font-size:.95rem;
  max-width:32ch;
  margin:0 auto;
  line-height:1.55;
}

/* search + doesn't matter */
.controls{
  display:flex;
  flex-direction:column;
  gap:.7rem;
  margin-bottom:1.5rem;
}
.search{
  width:100%;
  padding:.8rem 1rem;
  border-radius:.55rem;
  border:1px solid var(--border-dark);
  background:var(--curtain);
  color:var(--text);
  font-family:'Archivo',sans-serif;
  font-size:.95rem;
}
.search::placeholder{color:var(--text-muted);}
.search:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

.idc-btn{
  width:100%;
  padding:.85rem 1rem;
  border-radius:.55rem;
  border:1.5px dashed var(--accent2);
  background:transparent;
  color:var(--accent2);
  font-family:'Space Mono',ui-monospace,monospace;
  font-weight:700;
  font-size:.78rem;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.idc-btn:hover{background:var(--accent2); color:var(--accent2-ink);}
.idc-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.idc-btn[aria-pressed="true"]{background:var(--accent2); color:var(--accent2-ink);}

/* name grid — marquee bulb tags */
.section-label{
  font-family:'Space Mono',ui-monospace,monospace;
  font-size:.7rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--text-muted);
  margin:0 0 .6rem;
}
.name-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:.55rem;
  margin-bottom:2.2rem;
}
.name-chip{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:.18rem;
  padding:.55rem .75rem .55rem 1.65rem;
  border-radius:.55rem;
  border:1px solid var(--border-dark);
  background:var(--curtain);
  cursor:pointer;
  text-align:left;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.name-chip::before{
  content:"";
  position:absolute;
  left:.68rem;
  top:50%;
  transform:translateY(-50%);
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--border-dark);
  transition:background .15s ease, box-shadow .15s ease;
}
.chip-name{
  font-size:.87rem;
  font-weight:700;
  color:var(--text);
}
.chip-role{
  font-family:'Space Mono',ui-monospace,monospace;
  font-size:.66rem;
  letter-spacing:.01em;
  color:var(--text-muted);
}
.name-chip:hover{border-color:var(--accent);}
.name-chip:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.name-chip[aria-pressed="true"]{
  border-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 13%, var(--curtain));
}
.name-chip[aria-pressed="true"]::before{
  background:var(--accent);
  box-shadow:0 0 7px 2px rgba(255,183,3,.75);
}
.name-chip[aria-pressed="true"] .chip-name{color:var(--accent);}
.name-chip.hidden{display:none;}
.no-match{grid-column:1/-1; color:var(--text-muted); font-size:.88rem; padding:.3rem .1rem;}

/* results */
#results{scroll-margin-top:1rem;}
.results-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:.6rem;
  margin-bottom:.7rem;
  flex-wrap:wrap;
}
.results-title{
  font-family:'Bebas Neue',Impact,ui-sans-serif,sans-serif;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-size:1.55rem;
  margin:0;
  color:var(--text);
}
.results-count{
  font-family:'Space Mono',ui-monospace,monospace;
  font-size:.74rem;
  color:var(--text-muted);
}

.tickets{
  display:flex;
  flex-direction:column;
  gap:.8rem;
}
.ticket{
  position:relative;
  display:grid;
  grid-template-columns:3.6rem 1fr auto;
  align-items:center;
  gap:1rem;
  background:var(--paper);
  color:var(--ink);
  border-radius:.6rem;
  padding:.95rem 1.1rem;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.ticket::before,
.ticket::after{
  content:"";
  position:absolute;
  left:calc(3.6rem + .5rem);
  margin-left:-8px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--bg);
}
.ticket::before{top:-8px;}
.ticket::after{bottom:-8px;}
.ticket-date{
  font-family:'Space Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  text-align:center;
  line-height:1.15;
  min-width:0;
  border-right:1.5px dashed var(--border-paper);
  padding-right:.9rem;
}
.ticket-date .day{
  display:block;
  font-size:.64rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.ticket-date .num{
  display:block;
  font-size:1.4rem;
  font-weight:700;
  color:var(--ink);
}
.ticket-date .mon{
  display:block;
  font-size:.64rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.ticket-mid{min-width:0;}
.ticket-label{
  font-weight:700;
  font-size:.98rem;
  margin:0 0 .2rem;
}
.ticket-role{
  font-size:.83rem;
  color:var(--ink-soft);
  margin:0;
}
.ticket-role b{color:var(--ink); font-weight:700;}
.ticket-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:.35rem;
  text-align:right;
}
.ticket-time{
  font-family:'Space Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  font-size:.83rem;
  color:var(--ink-soft);
  white-space:nowrap;
}
.cast-badge{
  font-family:'Space Mono',ui-monospace,monospace;
  font-size:.65rem;
  font-weight:700;
  letter-spacing:.05em;
  padding:.16rem .5rem;
  border-radius:.2rem;
  white-space:nowrap;
  transform:rotate(-2deg);
  border:1.5px solid currentColor;
}
.cast-badge.a{color:#8a5a00; background:rgba(138,90,0,.09);}
.cast-badge.b{color:var(--accent2); background:rgba(224,72,62,.09);}

.ticket-best{
  box-shadow:0 6px 18px rgba(0,0,0,.35), 0 0 0 2px var(--accent), 0 0 26px rgba(255,183,3,.4);
}
.best-tag{
  display:inline-block;
  font-family:'Space Mono',ui-monospace,monospace;
  font-size:.6rem;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--accent-ink);
  background:var(--accent);
  padding:.12rem .42rem;
  border-radius:.2rem;
  margin-left:.4rem;
  vertical-align:middle;
}
.match-badge{
  font-family:'Space Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  font-size:.7rem;
  font-weight:700;
  color:var(--ink);
  background:var(--paper-shade);
  padding:.16rem .5rem;
  border-radius:.2rem;
  white-space:nowrap;
}
.ticket-role .as-role{color:var(--ink-soft); font-weight:500;}
.ticket-missing{
  font-size:.76rem;
  color:var(--ink-soft);
  margin:.35rem 0 0;
}
.picks-line{
  color:var(--text-muted);
  font-size:.85rem;
  margin:0 0 1rem;
}
.picks-line b{color:var(--accent); font-weight:700;}

.empty-state{
  border:1.5px dashed var(--border-dark);
  border-radius:.6rem;
  padding:1.6rem 1.2rem;
  text-align:center;
  color:var(--text-muted);
  font-size:.92rem;
  background:var(--curtain);
}

footer{
  margin-top:2.75rem;
  text-align:center;
  font-family:'Space Mono',ui-monospace,monospace;
  font-size:.72rem;
  letter-spacing:.02em;
  color:var(--text-muted);
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
</style>

<div class="wrap">
  <div class="marquee">
    <p class="eyebrow">Frozen &mdash; Sept 3&ndash;6</p>
    <h1>Who are you going to watch?</h1>
    <p class="sub">Pick everyone you want to see &mdash; we'll rank every performance by how many of your picks are in it.</p>
  </div>

  <div class="controls">
    <input class="search" id="search" type="text" placeholder="Search the cast&hellip;" autocomplete="off" aria-label="Search cast members">
    <button class="idc-btn" id="idc-btn" type="button" aria-pressed="false">It doesn't matter &mdash; just show me the full run</button>
  </div>

  <p class="section-label">Cast</p>
  <div class="name-grid" id="name-grid" role="group" aria-label="Cast members"></div>

  <div id="results"></div>

  <footer>Eight performances, one big feeling. Bring tissues for Act II.</footer>
</div>

<script>
const PERFORMANCES = [
  {mon:"Sep", num:"3",  day:"Thu", full:"Thursday, September 3", time:"9:00 AM", cast:"B", label:"School Show"},
  {mon:"Sep", num:"3",  day:"Thu", full:"Thursday, September 3", time:"7:00 PM", cast:"A", label:"Special Invitation"},
  {mon:"Sep", num:"4",  day:"Fri", full:"Friday, September 4",   time:"9:00 AM", cast:"B", label:"School Show"},
  {mon:"Sep", num:"4",  day:"Fri", full:"Friday, September 4",   time:"7:00 PM", cast:"A", label:"Opening Night"},
  {mon:"Sep", num:"5",  day:"Sat", full:"Saturday, September 5", time:"2:00 PM", cast:"A", label:"Matinee Show"},
  {mon:"Sep", num:"5",  day:"Sat", full:"Saturday, September 5", time:"7:00 PM", cast:"B", label:"Evening Show"},
  {mon:"Sep", num:"6",  day:"Sun", full:"Sunday, September 6",   time:"3:00 PM", cast:"A", label:"Matinee Show"},
  {mon:"Sep", num:"6",  day:"Sun", full:"Sunday, September 6",   time:"7:00 PM", cast:"B", label:"Closing Show"},
];

const ROLES = {
  "Anna":          ["GRACIE","ANYA","LANA","ANYA","ANYA","GRACIE","LANA","ANYA"],
  "Elsa":          ["SHANE","CARA","SHELBY","CARA","CARA","SHANE","SHELBY","CARA"],
  "Kristoff":      ["JOSH","JORDAN","JORDAN","JORDAN","JORDAN","JOSH","JORDAN","JOSH"],
  "Hans":          ["KAI","KAI","KAI","KAI","KAI","DON","DON","DON"],
  "Sven":          ["GAVIN","JACOB","JACOB","JACOB","GAVIN","GAVIN","JACOB","GAVIN"],
  "Olaf":          ["SOUL","CHRIS","CHRIS","CHRIS","SOUL","SOUL","CHRIS","SOUL"],
  "Weselton":      ["JEREMY","BRANDON","JEREMY","JEREMY","BRANDON","BRANDON","JEREMY","BRANDON"],
  "King Agnarr":   ["JUSTINE","CHRISTIAN","CHRISTIAN","CHRISTIAN","JUSTINE","JUSTINE","CHRISTIAN","JUSTINE"],
  "Queen Iduna":   ["PARADIS","PARADIS","DONNA","PARADIS","DONNA","DONNA","PARADIS","DONNA"],
  "Bulda":         ["PENNY","LILY","PENNY","LILY","LILY","PENNY","LILY","PENNY"],
  "Pabbie":        ["GAVIN","JACKSON","JACKSON","JACKSON","GAVIN","JACKSON","JACKSON","JACKSON"],
  "Oaken":         ["ALEXANDRE","STEPHEN","ALEXANDRE","STEPHEN","STEPHEN","ALEXANDRE","STEPHEN","ALEXANDRE"],
  "Young Anna":    ["LOLA","AVA G","ALEXIS","LOLA","ALIYA","ALIYA","AVA G","ALEXIS"],
  "Young Elsa":    ["ALYSSA","AVA MUNA","ALYSSA","AVA MUNA","MADYSON","HAYDEN","ALYSSA","AVA MUNA"],
  "Middle Anna":   ["JEMIAH","JEMIAH","CJ","JEMIAH","LAURA","LAURA","CJ","JEMIAH"],
  "Middle Elsa":   ["RHENAE","RHENAE","JENNA","RHENAE","ZAIA","SAYURI","CAITLYN","RHENAE"],
  "Bishop":        ["KAL-EL","LOGAN","KAL-EL","LOGAN","LOGAN","KAL-EL","KAL-EL","LOGAN"],
};

const DISPLAY_NAME = {
  "GRACIE":"Gracie","ANYA":"Anya","LANA":"Lana","SHANE":"Shane","CARA":"Cara","SHELBY":"Shelby",
  "JOSH":"Josh","JORDAN":"Jordan","KAI":"Kai","DON":"Don","GAVIN":"Gavin","JACOB":"Jacob",
  "SOUL":"Soul","CHRIS":"Chris","JEREMY":"Jeremy","BRANDON":"Brandon","JUSTINE":"Justine",
  "CHRISTIAN":"Christian","PARADIS":"Paradis","DONNA":"Donna","PENNY":"Penny","LILY":"Lily",
  "JACKSON":"Jackson","ALEXANDRE":"Alexandre","STEPHEN":"Stephen","LOLA":"Lola","AVA G":"Ava G.",
  "ALEXIS":"Alexis","ALIYA":"Aliya","ALYSSA":"Alyssa","AVA MUNA":"Ava Muna","MADYSON":"Madyson",
  "HAYDEN":"Hayden","JEMIAH":"Jemiah","CJ":"CJ","LAURA":"Laura","RHENAE":"Rhenae","JENNA":"Jenna",
  "ZAIA":"Zaia","SAYURI":"Sayuri","CAITLYN":"Caitlyn","KAL-EL":"Kal-El","LOGAN":"Logan",
};

const namesIndex = {};
Object.entries(ROLES).forEach(([role, casts]) => {
  casts.forEach((raw, i) => {
    if(!namesIndex[raw]) namesIndex[raw] = [];
    let entry = namesIndex[raw].find(e => e.perf === i);
    if(!entry){ entry = {perf:i, roles:[]}; namesIndex[raw].push(entry); }
    entry.roles.push(role);
  });
});

const allRawNames = Object.keys(namesIndex).sort((a,b) => DISPLAY_NAME[a].localeCompare(DISPLAY_NAME[b]));

const grid = document.getElementById('name-grid');
const resultsEl = document.getElementById('results');
const searchEl = document.getElementById('search');
const idcBtn = document.getElementById('idc-btn');

const selected = new Set(); // raw names, multi-select
let idcActive = false;

allRawNames.forEach(raw => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'name-chip';
  const roles = [...new Set(namesIndex[raw].flatMap(e => e.roles))];
  const nameSpan = document.createElement('span');
  nameSpan.className = 'chip-name';
  nameSpan.textContent = DISPLAY_NAME[raw];
  const roleSpan = document.createElement('span');
  roleSpan.className = 'chip-role';
  roleSpan.textContent = roles.join(' / ');
  chip.append(nameSpan, roleSpan);
  chip.setAttribute('aria-pressed','false');
  chip.dataset.raw = raw;
  chip.addEventListener('click', () => toggleName(raw));
  grid.appendChild(chip);
});

function toggleName(raw){
  idcActive = false;
  idcBtn.setAttribute('aria-pressed','false');
  const chip = grid.querySelector(`.name-chip[data-raw="${CSS.escape(raw)}"]`);
  if(selected.has(raw)){
    selected.delete(raw);
    if(chip) chip.setAttribute('aria-pressed','false');
  } else {
    selected.add(raw);
    if(chip) chip.setAttribute('aria-pressed','true');
  }
  renderResults();
}

idcBtn.addEventListener('click', () => {
  selected.clear();
  grid.querySelectorAll('.name-chip').forEach(c => c.setAttribute('aria-pressed','false'));
  idcActive = true;
  idcBtn.setAttribute('aria-pressed','true');
  renderFullRun();
});

searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  let anyVisible = false;
  grid.querySelectorAll('.name-chip').forEach(chip => {
    const match = DISPLAY_NAME[chip.dataset.raw].toLowerCase().includes(q);
    chip.classList.toggle('hidden', !match);
    if(match) anyVisible = true;
  });
  let noMatch = grid.querySelector('.no-match');
  if(!anyVisible){
    if(!noMatch){
      noMatch = document.createElement('p');
      noMatch.className = 'no-match';
      noMatch.textContent = 'No one by that name — check the spelling?';
      grid.appendChild(noMatch);
    }
  } else if(noMatch){
    noMatch.remove();
  }
});

function ticketHTML(perf, roleText){
  return `
    <div class="ticket">
      <div class="ticket-date">
        <span class="day">${perf.day}</span>
        <span class="num">${perf.num}</span>
        <span class="mon">${perf.mon}</span>
      </div>
      <div class="ticket-mid">
        <p class="ticket-label">${perf.label}</p>
        <p class="ticket-role">${roleText}</p>
      </div>
      <div class="ticket-right">
        <span class="cast-badge ${perf.cast.toLowerCase()}">Cast ${perf.cast}</span>
        <span class="ticket-time">${perf.time}</span>
      </div>
    </div>`;
}

function bestTicketHTML(perf, matched, total, isBest){
  const names = matched.map(m =>
    `<b>${DISPLAY_NAME[m.raw]}</b> <span class="as-role">as ${m.roles.join(' &amp; ')}</span>`
  ).join(', ');
  const missing = total > 1
    ? [...selected].filter(raw => !matched.some(m => m.raw === raw))
    : [];
  const missingHTML = missing.length
    ? `<p class="ticket-missing">Not in this one: ${missing.map(raw => DISPLAY_NAME[raw]).join(', ')}</p>`
    : '';
  const bestTag = isBest && total > 1 ? '<span class="best-tag">Best match</span>' : '';
  const badge = total > 1 ? `<span class="match-badge">${matched.length}/${total}</span>` : '';

  return `
    <div class="ticket ${isBest && total > 1 ? 'ticket-best' : ''}">
      <div class="ticket-date">
        <span class="day">${perf.day}</span>
        <span class="num">${perf.num}</span>
        <span class="mon">${perf.mon}</span>
      </div>
      <div class="ticket-mid">
        <p class="ticket-label">${perf.label}${bestTag}</p>
        <p class="ticket-role">${names}</p>
        ${missingHTML}
      </div>
      <div class="ticket-right">
        ${badge}
        <span class="cast-badge ${perf.cast.toLowerCase()}">Cast ${perf.cast}</span>
        <span class="ticket-time">${perf.time}</span>
      </div>
    </div>`;
}

function renderResults(){
  if(selected.size === 0){
    resultsEl.innerHTML = `<div class="empty-state">Pick one or more cast members above and we'll rank the shows for you.</div>`;
    return;
  }

  const total = selected.size;
  const ranked = PERFORMANCES
    .map((perf, i) => {
      const matched = [...selected]
        .map(raw => {
          const entry = namesIndex[raw].find(e => e.perf === i);
          return entry ? {raw, roles: entry.roles} : null;
        })
        .filter(Boolean);
      return {perf, matched};
    })
    .filter(r => r.matched.length > 0)
    .sort((a, b) => b.matched.length - a.matched.length);

  if(ranked.length === 0){
    resultsEl.innerHTML = `
      <div class="results-head"><h2 class="results-title">No overlap</h2></div>
      <div class="empty-state">None of your picks share a performance &mdash; double-check the names or try fewer picks.</div>
    `;
    return;
  }

  const bestCount = ranked[0].matched.length;
  const title = total === 1 ? `${DISPLAY_NAME[[...selected][0]]}'s performances` : 'Best show for your group';
  const picksLine = total > 1
    ? `<p class="picks-line">Ranked for: ${[...selected].map(r => `<b>${DISPLAY_NAME[r]}</b>`).join(', ')}</p>`
    : '';

  const tickets = ranked.map(r => bestTicketHTML(r.perf, r.matched, total, r.matched.length === bestCount)).join('');

  resultsEl.innerHTML = `
    <div class="results-head">
      <h2 class="results-title">${title}</h2>
      <span class="results-count">${ranked.length} of 8 shows</span>
    </div>
    ${picksLine}
    <div class="tickets">${tickets}</div>
  `;
  resultsEl.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderFullRun(){
  const tickets = PERFORMANCES.map(perf => ticketHTML(perf, `${perf.full}`)).join('');
  resultsEl.innerHTML = `
    <div class="results-head">
      <h2 class="results-title">Any night's a good night</h2>
      <span class="results-count">8 shows</span>
    </div>
    <div class="tickets">${tickets}</div>
  `;
  resultsEl.scrollIntoView({behavior:'smooth', block:'nearest'});
}

renderResults();
</script>
