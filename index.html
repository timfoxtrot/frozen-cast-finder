<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frozen Cast Finder</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-900">
<div class="mx-auto max-w-xl px-4 pb-16 pt-8 sm:pt-10">

  <header class="mb-6 text-center">
    <p class="text-[11px] font-medium uppercase tracking-wide text-slate-400">Frozen &middot; Sept 3&ndash;6</p>
    <h1 class="mt-1 text-2xl font-bold text-slate-900 sm:text-3xl">Who are you going to watch?</h1>
    <p class="mx-auto mt-2 max-w-xs text-sm text-slate-500">Pick everyone you want to see &mdash; we'll rank every show by how many of your picks are in it.</p>
  </header>

  <div class="mb-5 space-y-2">
    <input id="search" type="text" placeholder="Search the cast&hellip;" autocomplete="off" aria-label="Search cast members"
      class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-400">
    <button id="idc-btn" type="button" aria-pressed="false"
      class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm font-medium text-slate-500 transition-colors hover:border-slate-300 hover:text-slate-700">
      It doesn't matter &mdash; just show me the full run
    </button>
  </div>

  <div id="name-grid" class="mb-2 border-y border-slate-100 divide-y divide-slate-100" role="group" aria-label="Cast members, by role"></div>
  <p id="no-match" hidden class="py-2 text-sm text-slate-400">No one by that name &mdash; check the spelling?</p>

  <div id="results" class="mt-6"></div>

  <footer class="mt-10 text-center text-xs text-slate-400">Eight performances, one big feeling.</footer>
</div>

<script>
const PERFORMANCES = [
  {mon:"Sep", num:"3",  day:"Thu", time:"9:00 AM", cast:"B", label:"School Show"},
  {mon:"Sep", num:"3",  day:"Thu", time:"7:00 PM", cast:"A", label:"Special Invitation"},
  {mon:"Sep", num:"4",  day:"Fri", time:"9:00 AM", cast:"B", label:"School Show"},
  {mon:"Sep", num:"4",  day:"Fri", time:"7:00 PM", cast:"A", label:"Opening Night"},
  {mon:"Sep", num:"5",  day:"Sat", time:"2:00 PM", cast:"A", label:"Matinee Show"},
  {mon:"Sep", num:"5",  day:"Sat", time:"7:00 PM", cast:"B", label:"Evening Show"},
  {mon:"Sep", num:"6",  day:"Sun", time:"3:00 PM", cast:"A", label:"Matinee Show"},
  {mon:"Sep", num:"6",  day:"Sun", time:"7:00 PM", cast:"B", label:"Closing Show"},
];

const ROLES = {
  "Anna":          ["GRACIE","ANYA","LANA","ANYA","ANYA","GRACIE","LANA","ANYA"],
  "Elsa":          ["SHANE","CARA","SHELBY","CARA","CARA","SHANE","SHELBY","CARA"],
  "Kristoff":      ["JOSH","JORDAN","JORDAN","JORDAN","JORDAN","JOSH","JORDAN","JOSH"],
  "Hans":          ["KAI","KAI","KAI","KAI","KAI","DON","DON","DON"],
  "Sven":          ["GAVIN","JACOB","JACOB","JACOB","GAVIN","GAVIN","JACOB","GAVIN"],
  "Olaf":          ["SOUL","CHRIS","CHRIS","CHRIS","SOUL","SOUL","CHRIS","SOUL"],
  "Weselton":      ["JEREMY","BRANDON","JEREMY","JEREMY","BRANDON","BRANDON","JEREMY","BRANDON"],
  "King Agnarr":   ["JUSTINE","CHRISTIAN","CHRISTIAN","CHRISTIAN","JUSTINE","JUSTINE","CHRISTIAN","JUSTINE"],
  "Queen Iduna":   ["PARADIS","PARADIS","DONNA","PARADIS","DONNA","DONNA","PARADIS","DONNA"],
  "Bulda":         ["PENNY","LILY","PENNY","LILY","LILY","PENNY","LILY","PENNY"],
  "Pabbie":        ["GAVIN","JACKSON","JACKSON","JACKSON","GAVIN","JACKSON","JACKSON","JACKSON"],
  "Oaken":         ["ALEXANDRE","STEPHEN","ALEXANDRE","STEPHEN","STEPHEN","ALEXANDRE","STEPHEN","ALEXANDRE"],
  "Young Anna":    ["LOLA","AVA G","ALEXIS","LOLA","ALIYA","ALIYA","AVA G","ALEXIS"],
  "Young Elsa":    ["ALYSSA","AVA MUNA","ALYSSA","AVA MUNA","MADYSON","HAYDEN","ALYSSA","AVA MUNA"],
  "Middle Anna":   ["JEMIAH","JEMIAH","CJ","JEMIAH","LAURA","LAURA","CJ","JEMIAH"],
  "Middle Elsa":   ["RHENAE","RHENAE","JENNA","RHENAE","ZAIA","SAYURI","CAITLYN","RHENAE"],
  "Bishop":        ["KAL-EL","LOGAN","KAL-EL","LOGAN","LOGAN","KAL-EL","KAL-EL","LOGAN"],
};

const DISPLAY_NAME = {
  "GRACIE":"Gracie","ANYA":"Anya","LANA":"Lana","SHANE":"Shane","CARA":"Cara","SHELBY":"Shelby",
  "JOSH":"Josh","JORDAN":"Jordan","KAI":"Kai","DON":"Don","GAVIN":"Gavin","JACOB":"Jacob",
  "SOUL":"Soul","CHRIS":"Chris","JEREMY":"Jeremy","BRANDON":"Brandon","JUSTINE":"Justine",
  "CHRISTIAN":"Christian","PARADIS":"Paradis","DONNA":"Donna","PENNY":"Penny","LILY":"Lily",
  "JACKSON":"Jackson","ALEXANDRE":"Alexandre","STEPHEN":"Stephen","LOLA":"Lola","AVA G":"Ava G.",
  "ALEXIS":"Alexis","ALIYA":"Aliya","ALYSSA":"Alyssa","AVA MUNA":"Ava Muna","MADYSON":"Madyson",
  "HAYDEN":"Hayden","JEMIAH":"Jemiah","CJ":"CJ","LAURA":"Laura","RHENAE":"Rhenae","JENNA":"Jenna",
  "ZAIA":"Zaia","SAYURI":"Sayuri","CAITLYN":"Caitlyn","KAL-EL":"Kal-El","LOGAN":"Logan",
};

const namesIndex = {};
Object.entries(ROLES).forEach(([role, casts]) => {
  casts.forEach((raw, i) => {
    if(!namesIndex[raw]) namesIndex[raw] = [];
    let entry = namesIndex[raw].find(e => e.perf === i);
    if(!entry){ entry = {perf:i, roles:[]}; namesIndex[raw].push(entry); }
    entry.roles.push(role);
  });
});

const grid = document.getElementById('name-grid');
const resultsEl = document.getElementById('results');
const searchEl = document.getElementById('search');
const idcBtn = document.getElementById('idc-btn');
const noMatchEl = document.getElementById('no-match');

const selected = new Set(); // raw names, multi-select
let idcActive = false;

const CHIP_ON = ['bg-slate-900','border-slate-900','text-white'];
const CHIP_OFF = ['bg-white','border-slate-200','text-slate-700'];

// One inline row per role, in spreadsheet order; each role lists everyone
// who ever played it (a person can appear in more than one role's row).
Object.entries(ROLES).forEach(([role, casts]) => {
  const uniqueRaw = [...new Set(casts)];

  const row = document.createElement('div');
  row.className = 'role-row flex flex-wrap items-center gap-x-2 gap-y-1.5 py-2';

  const label = document.createElement('span');
  label.className = 'shrink-0 whitespace-nowrap text-[10px] font-semibold uppercase tracking-wide text-slate-400';
  label.textContent = role;
  row.appendChild(label);

  const chipRow = document.createElement('div');
  chipRow.className = 'flex flex-1 flex-wrap gap-1.5';
  uniqueRaw.forEach(raw => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = ['name-chip','rounded-full','border','px-2.5','py-1','text-xs','font-medium','transition-colors',...CHIP_OFF].join(' ');
    chip.textContent = DISPLAY_NAME[raw];
    chip.setAttribute('aria-pressed', 'false');
    chip.dataset.raw = raw;
    chip.addEventListener('click', () => toggleName(raw));
    chipRow.appendChild(chip);
  });
  row.appendChild(chipRow);
  grid.appendChild(row);
});

function toggleName(raw){
  idcActive = false;
  setIdcPressed(false);
  const nowPressed = !selected.has(raw);
  if(nowPressed) selected.add(raw); else selected.delete(raw);
  // a person can have a chip in more than one role row — keep them in sync
  grid.querySelectorAll(`.name-chip[data-raw="${CSS.escape(raw)}"]`).forEach(c => {
    c.setAttribute('aria-pressed', String(nowPressed));
    c.classList.remove(...(nowPressed ? CHIP_OFF : CHIP_ON));
    c.classList.add(...(nowPressed ? CHIP_ON : CHIP_OFF));
  });
  renderResults();
}

function setIdcPressed(on){
  idcBtn.setAttribute('aria-pressed', String(on));
  idcBtn.classList.toggle('bg-slate-900', on);
  idcBtn.classList.toggle('border-slate-900', on);
  idcBtn.classList.toggle('text-white', on);
  idcBtn.classList.toggle('text-slate-500', !on);
}

idcBtn.addEventListener('click', () => {
  selected.clear();
  grid.querySelectorAll('.name-chip').forEach(c => {
    c.setAttribute('aria-pressed','false');
    c.classList.remove(...CHIP_ON);
    c.classList.add(...CHIP_OFF);
  });
  idcActive = true;
  setIdcPressed(true);
  renderFullRun();
});

searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  let anyVisible = false;
  grid.querySelectorAll('.role-row').forEach(row => {
    let rowVisible = false;
    row.querySelectorAll('.name-chip').forEach(chip => {
      const match = DISPLAY_NAME[chip.dataset.raw].toLowerCase().includes(q);
      chip.classList.toggle('hidden', !match);
      if(match){ rowVisible = true; anyVisible = true; }
    });
    row.classList.toggle('hidden', !rowVisible);
  });
  noMatchEl.hidden = anyVisible;
});

function fullCastListHTML(i){
  const rows = Object.entries(ROLES).map(([role, casts]) =>
    `<div class="truncate"><span class="text-slate-400">${role}</span>
      <span class="text-slate-800">${DISPLAY_NAME[casts[i]]}</span></div>`
  ).join('');
  return `
    <div class="border-t border-slate-100 px-3 py-3">
      <p class="mb-2 text-[10px] font-semibold uppercase tracking-wide text-slate-400">Full cast</p>
      <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs sm:grid-cols-3">${rows}</div>
    </div>`;
}

const CHEVRON = `<svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4 shrink-0 text-slate-300 transition-transform duration-150 group-open:rotate-180">
  <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd"/>
</svg>`;

function ticketShell(i, summaryHTML){
  return `
    <details class="group rounded-lg border border-slate-200 open:border-slate-300">
      <summary class="flex cursor-pointer list-none items-center gap-3 p-3 [&::-webkit-details-marker]:hidden">
        ${summaryHTML}
        ${CHEVRON}
      </summary>
      ${fullCastListHTML(i)}
    </details>`;
}

function dateBlockHTML(perf){
  return `
    <div class="w-10 shrink-0 text-center leading-tight">
      <div class="text-[9px] uppercase text-slate-400">${perf.day}</div>
      <div class="text-lg font-bold text-slate-900">${perf.num}</div>
      <div class="text-[9px] uppercase text-slate-400">${perf.mon}</div>
    </div>`;
}

function rightColHTML(perf, extraBadge){
  return `
    <div class="flex shrink-0 flex-col items-end gap-0.5 text-right">
      ${extraBadge || ''}
      <span class="text-[10px] font-medium text-slate-400">Cast ${perf.cast}</span>
      <span class="text-xs text-slate-500">${perf.time}</span>
    </div>`;
}

function bestTicketHTML(perf, i, matched, total, isBest){
  const names = matched.map(m =>
    `<b class="font-semibold text-slate-800">${DISPLAY_NAME[m.raw]}</b> <span class="text-slate-400">as ${m.roles.join(' &amp; ')}</span>`
  ).join(', ');
  const missing = total > 1 ? [...selected].filter(raw => !matched.some(m => m.raw === raw)) : [];
  const missingHTML = missing.length
    ? `<p class="mt-0.5 truncate text-[11px] text-slate-400">Not in this one: ${missing.map(raw => DISPLAY_NAME[raw]).join(', ')}</p>`
    : '';
  const bestTag = isBest && total > 1 ? '<span class="ml-1.5 text-[10px] font-semibold uppercase text-emerald-600">Best match</span>' : '';
  const badge = total > 1
    ? `<span class="rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-semibold text-slate-600">${matched.length}/${total}</span>`
    : '';

  const summary = `
    ${dateBlockHTML(perf)}
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold text-slate-900">${perf.label}${bestTag}</p>
      <p class="truncate text-xs text-slate-500">${names}</p>
      ${missingHTML}
    </div>
    ${rightColHTML(perf, badge)}`;

  return ticketShell(i, summary);
}

function plainTicketHTML(perf, i){
  const summary = `
    ${dateBlockHTML(perf)}
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold text-slate-900">${perf.label}</p>
      <p class="truncate text-xs text-slate-400">Tap to see the full cast</p>
    </div>
    ${rightColHTML(perf, '')}`;
  return ticketShell(i, summary);
}

function renderResults(){
  if(selected.size === 0){
    resultsEl.innerHTML = `<div class="rounded-lg border border-dashed border-slate-200 py-8 text-center text-sm text-slate-400">Pick one or more cast members above and we'll rank the shows for you.</div>`;
    return;
  }

  const total = selected.size;
  const ranked = PERFORMANCES
    .map((perf, i) => {
      const matched = [...selected]
        .map(raw => {
          const entry = namesIndex[raw].find(e => e.perf === i);
          return entry ? {raw, roles: entry.roles} : null;
        })
        .filter(Boolean);
      return {perf, i, matched};
    })
    .filter(r => r.matched.length > 0)
    .sort((a, b) => b.matched.length - a.matched.length);

  if(ranked.length === 0){
    resultsEl.innerHTML = `
      <h2 class="mb-2 text-lg font-bold text-slate-900">No overlap</h2>
      <div class="rounded-lg border border-dashed border-slate-200 py-8 text-center text-sm text-slate-400">None of your picks share a performance &mdash; try fewer picks.</div>
    `;
    return;
  }

  const bestCount = ranked[0].matched.length;
  const title = total === 1 ? `${DISPLAY_NAME[[...selected][0]]}'s performances` : 'Best show for your group';
  const picksLine = total > 1
    ? `<p class="mb-3 text-xs text-slate-400">Ranked for: ${[...selected].map(r => `<b class="font-semibold text-slate-600">${DISPLAY_NAME[r]}</b>`).join(', ')}</p>`
    : '';

  const tickets = ranked.map(r => bestTicketHTML(r.perf, r.i, r.matched, total, r.matched.length === bestCount)).join('');

  resultsEl.innerHTML = `
    <div class="mb-1 flex flex-wrap items-baseline justify-between gap-2">
      <h2 class="text-lg font-bold text-slate-900">${title}</h2>
      <span class="text-xs text-slate-400">${ranked.length} of 8 shows</span>
    </div>
    ${picksLine}
    <div class="space-y-2">${tickets}</div>
  `;
  resultsEl.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderFullRun(){
  const tickets = PERFORMANCES.map((perf, i) => plainTicketHTML(perf, i)).join('');
  resultsEl.innerHTML = `
    <div class="mb-3 flex flex-wrap items-baseline justify-between gap-2">
      <h2 class="text-lg font-bold text-slate-900">Any night's a good night</h2>
      <span class="text-xs text-slate-400">8 shows</span>
    </div>
    <div class="space-y-2">${tickets}</div>
  `;
  resultsEl.scrollIntoView({behavior:'smooth', block:'nearest'});
}

renderResults();
</script>
</body>
</html>
